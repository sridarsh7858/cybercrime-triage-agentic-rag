[project]
name = "cybercrime-triage"
version = "0.1.0"
description = "Agentic RAG triage for Indian cybercrime and financial-fraud complaints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.0",
    "easyocr>=1.7.1",
    "fastapi>=0.110.0",
    "langchain>=1.3.14",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.4.2",
    "langchain-core>=0.2.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=0.2.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.28.0",
]

# Only needed to record the README preview video (scripts/record_preview.py).
# After installing, also fetch the browser: python -m playwright install chromium
# imageio-ffmpeg ships a static ffmpeg, so the WebM -> MP4 transcode works
# without a system-wide ffmpeg install.
[project.optional-dependencies]
preview = [
    "playwright>=1.45.0",
    "imageio-ffmpeg>=0.5.1",
]
